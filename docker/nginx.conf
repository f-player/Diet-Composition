user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # include /etc/nginx/conf.d/*.conf;

    upstream minio {
        server minio1:9000;
        server minio2:9000;
        server minio3:9000;
        server minio4:9000;
    }

    upstream console {
        ip_hash;
        server minio1:9001;
        server minio2:9001;
        server minio3:9001;
        server minio4:9001;
    }

    # HTTP -> HTTPS redirect for the public domain
    # Default HTTP server (accepts any Host) — useful for tunnels (cloudflared)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Proxy any HTTP request to the MinIO cluster. Cloudflare Tunnel
        # will terminate TLS on the edge and forward traffic here over HTTP.
        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio;
        }
    }

    # HTTP -> HTTPS redirect for the public domain
    server {
        listen 80;
        listen [::]:80;
        server_name rip-meo.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS server for MinIO (proxy to internal MinIO cluster)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rip-meo.duckdns.org;

        # Use certificates mounted under /etc/nginx/certs (fallback to self-signed)
        # When Let's Encrypt certs are installed you can copy them into the
        # project's ./certs directory as fullchain.pem and privkey.pem and nginx
        # will use them on restart.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Allow large uploads
        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;

        # Proxy root to MinIO API
        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            proxy_pass http://minio;
        }

        # Proxy console under /console path
        location /console/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://console/;
        }
    }
}